name: bwa-mem2_mem_rna
description: The mem alignment algorithm of bwa-mem2, for RNA reads
keywords:
  - bwa
  - mem
  - read alignment
  - bwa-mem2
  - rna
tools:
  - bwa-mem2:
      description: Burrow-Wheeler Aligner for short-read alignment
      homepage: https://github.com/bwa-mem2/bwa-mem2
      documentation: https://github.com/bwa-mem2/bwa-mem2
      licence: ["MIT"]
input:
  - meta:
      type: map
      description: |
        Groovy Map containing sample information
        e.g. [id: 'sample_id']
  - reads_fwd:
      type: file
      description: Forward reads FASTQ file
      pattern: "*.{fastq.gz}"
  - reads_rev:
      type: file
      description: Reverse reads FASTQ file
      pattern: "*.{fastq.gz}"
  - genome_fasta:
      type: file
      description: Reference genome assembly FASTA file
      pattern: "*.{fa,fasta}"
  - genome_bwamem2_index:
      type: directory
      description: bwa-mem2 index directory
output:
  - meta:
      type: map
      description: |
        Groovy Map containing sample information
        e.g. [id: 'sample_id']
  - bwamem2_align_rna_bam:
      type: file
      description: |
        Name-grouped, unindexed BAM file; TARS consumes read groups so the BAM must not be
        coordinate sorted
      pattern: "*.{bam}"
  - command_files:
      type: list
      description: List of command files
  - versions:
      type: file
      description: File containing software versions
      pattern: "versions.yml"
authors:
  - "@scwatts"
  - "@mkcmkc"
