name: bamtools
description: Rapidly process BAMs for various tasks
keywords:
  - bam
tools:
  - bamtools:
      description: Performs rapid processing of BAM files
      homepage: https://github.com/hartwigmedical/hmftools/tree/master/bam-tools
      documentation: https://github.com/hartwigmedical/hmftools/tree/master/bam-tools
      licence: ["GPL v3"]
input:
  - meta:
      type: map
      description: |
        Groovy Map containing sample information
        e.g. [id: 'sample_id']
  - aln:
      type: file
      description: Alignment file
      pattern: "*.{bam,cram}"
  - idx:
      type: file
      description: Index file
      pattern: "*.{bai,crai}"
  - genome_fasta:
      type: file
      description: Reference genome assembly FASTA file
      pattern: "*.{fa,fasta}"
  - genome_ver:
      type: string
      description: Reference genome version
  - genome_fai:
      type: file
      description: Reference genome assembly fai file
      pattern: "*.{fai}"
  - driver_gene_panel:
      type: file
      description: Driver gene panel file
      pattern: "*.{tsv}"
  - ensembl_data_resources:
      type: directory
      description: HMF ensembl data resources directory
  - target_region_bed:
      type: file
      description: Target regions BED file (optional)
      pattern: "*.{bed}"
output:
  - meta:
      type: map
      description: |
        Groovy Map containing sample information
        e.g. [id: 'sample_id']
  - bamtools_metrics_dir:
      type: directory
      description: Alignment metrics directory
  - command_files:
      type: list
      description: List of command files
  - versions:
      type: file
      description: File containing software versions
      pattern: "versions.yml"
authors:
  - "@scwatts"
