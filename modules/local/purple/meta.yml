name: purple
description: Estimate purity and ploidy from WGS data
keywords:
  - variant caller
  - ploidy
  - purity
  - cnv
  - sv
tools:
  - purple:
      description: Estimates purity and ploidy from WGS data
      homepage: https://github.com/hartwigmedical/hmftools/tree/master/purple
      documentation: https://github.com/hartwigmedical/hmftools/tree/master/purple
      licence:
        - GPL v3
input:
  - - meta:
        type: map
        description: |-
          Groovy Map containing sample information
          e.g. [id: 'sample_id']
    - amber_dir:
        type: directory
        description: AMBER output directory
    - cobalt_dir:
        type: directory
        description: COBALT output directory
    - esvee_dir:
        type: directory
        description: ESVEE output directory (optional)
    - pave_somatic_dir:
        type: directory
        description: PAVE somatic output directory (optional)
    - pave_germline_dir:
        type: directory
        description: PAVE germline output directory (optional)
    - redux_tumor_tsvs:
        type: list
        description: REDUX tumor TSV files (optional)
  - - genome_fasta:
        type: file
        description: Reference genome assembly FASTA file
        pattern: '*.{fa,fasta}'
  - - genome_ver:
        type: string
        description: Reference genome version
  - - genome_fai:
        type: file
        description: Reference genome assembly fai file
        pattern: '*.{fai}'
  - - genome_dict:
        type: file
        description: Reference genome assembly dict file
        pattern: '*.{dict}'
  - - gc_profile:
        type: file
        description: GC profile file
        pattern: '*.{cnp}'
  - - sage_known_hotspots_somatic:
        type: file
        description: SAGE somatic known hotspots file
        pattern: '*.{vcf.gz}'
  - - sage_known_hotspots_germline:
        type: file
        description: SAGE germline known hotspots file (optional)
        pattern: '*.{vcf.gz}'
  - - driver_gene_panel:
        type: file
        description: Driver gene panel file
        pattern: '*.{tsv}'
  - - ensembl_data_resources:
        type: directory
        description: HMF ensembl data resources directory
  - - germline_amp_del_freq:
        type: file
        description: Cohort frequency for germline deletions (optional)
        pattern: '*.{csv}'
  - - target_regions_bed:
        type: file
        description: Target regions BED file (optional)
        pattern: '*.{bed}'
output: {}
topics:
  purple_dir:
    - - meta:
          type: map
          description: |-
            Groovy Map containing sample information
            e.g. [id: 'sample_id']
      - purple/:
          type: directory
          description: PURPLE output directory
  command_files:
    - - meta:
          type: map
          description: |-
            Groovy Map containing sample information
            e.g. [id: 'sample_id']
      - identifier:
          type: string
          description: Identifier for command files
      - command_files:
          type: list
          description: List of command files
  versions:
    - - versions.yml:
          type: file
          description: File containing software versions
          pattern: versions.yml
authors:
  - '@scwatts'
