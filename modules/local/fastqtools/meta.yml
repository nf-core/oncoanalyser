name: fastq_tools
description: Operate on FASTQs to process UMIs
keywords:
  - fastq-tools
  - processing
  - umi
tools:
  - fastq-tools:
      description: FASTQ processor
      homepage: https://github.com/hartwigmedical/hmftools/tree/master/fastq-tools
      licence:
        - MIT
input:
  - - meta:
        type: map
        description: |-
          Groovy Map containing sample information
          e.g. [id: 'sample_id']
    - reads_fwd:
        type: file
        description: Forward reads FASTQ file
        pattern: '*.{fastq.gz}'
    - reads_rev:
        type: file
        description: Reverse reads FASTQ file
        pattern: '*.{fastq.gz}'
  - - umi_delim:
        type: string
        description: UMI delimiter
  - - known_umis:
        type: file
        description: Known UMIs file
output: {}
topics:
  fastqtools_fastq:
    - - meta:
          type: map
          description: |-
            Groovy Map containing sample information
            e.g. [id: 'sample_id']
      - output/*R1.umi.fastq.gz:
          type: file
          description: Forward reads FASTQ file
          pattern: output/*R1.umi.fastq.gz
      - output/*R2.umi.fastq.gz:
          type: file
          description: Reverse reads FASTQ file
          pattern: output/*R2.umi.fastq.gz
  command_files:
    - - meta:
          type: map
          description: |-
            Groovy Map containing sample information
            e.g. [id: 'sample_id']
      - identifier:
          type: string
          description: Identifier for command files
      - command_files:
          type: list
          description: List of command files
  versions:
    - - versions.yml:
          type: file
          description: File containing software versions
          pattern: versions.yml
authors:
  - '@luan-n-nguyen'
  - '@scwatts'
