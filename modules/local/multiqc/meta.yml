name: multiqc
description: Aggregate results from bioinformatics analyses across many samples
  into a single report
keywords:
  - QC
  - bioinformatics tools
  - Beautiful stand-alone HTML report
tools:
  - multiqc:
      description: |
        MultiQC searches a given directory for analysis logs and compiles a HTML report.
        It's a general use tool, perfect for summarising the output from numerous bioinformatics tools.
      homepage: https://multiqc.info/
      documentation: https://multiqc.info/docs/
      licence:
        - "GPL-3.0-or-later"
      identifier: biotools:multiqc
input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. [ id:'sample1', single_end:false ]
    - fs_group_ids:
        type: list
        description: |
          List of file group identifiers
        ontologies: []
    - fs:
        type: list
        description: |
          List of sample reports / files recognised by MultiQC
        ontologies: []
    - multiqc_files_other:
        type: file
        description: |
          List of other reports / files recognised by MultiQC, for example the html and zip output of FastQC
        ontologies: []
    - multiqc_config:
        type: file
        description: Optional config yml for MultiQC
        pattern: "*.{yml,yaml}"
        ontologies:
          - edam: http://edamontology.org/format_3750
    - extra_multiqc_config:
        type: file
        description: Optional extra config yml for MultiQC
        pattern: "*.{yml,yaml}"
        ontologies:
          - edam: http://edamontology.org/format_3750
    - multiqc_logo:
        type: file
        description: Optional logo file for MultiQC
        pattern: "*.{png}"
        ontologies: []
output:
  multiqc_report:
    - - "*.html":
          type: file
          description: MultiQC report file
          pattern: ".html"
          ontologies: []
  multiqc_data:
    - - "*_data":
          type: directory
          description: MultiQC data dir
          pattern: "multiqc_data"
  multiqc_plots:
    - - "*_plots":
          type: file
          description: Plots created by MultiQC
          pattern: "*_plots"
          ontologies: []
  command_files:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'sample1', single_end:false ]
      - identifier:
        type: string
        description: Identifier for command files
      - command_files:
        type: list
        description: List of command files
authors:
  - "@abhi18av"
  - "@bunop"
  - "@drpatelh"
  - "@jfy133"
  - "@scwatts"
