name: fastp_split
description: An ultra-fast all-in-one FASTQ preprocessor
keywords:
  - fastp
  - fastq
  - processing
  - quality control
tools:
  - fastp:
      description: An ultra-fast all-in-one FASTQ preprocessor
      homepage: https://github.com/OpenGene/fastp
      documentation: https://github.com/OpenGene/fastp
      licence:
        - MIT
input:
  - - meta:
        type: map
        description: |-
          Groovy Map containing sample information
          e.g. [id: 'sample_id']
    - reads_fwd:
        type: file
        description: Forward reads FASTQ file
        pattern: '*.{fastq.gz}'
    - reads_rev:
        type: file
        description: Reverse reads FASTQ file
        pattern: '*.{fastq.gz}'
  - - max_fastq_records:
        type: integer
        description: Maximum number of reads per file
output: {}
topics:
  fastp_split_fastq:
    - - meta:
          type: map
          description: |-
            Groovy Map containing sample information
            e.g. [id: 'sample_id']
      - output/*_R1.fastp_split.fastq.gz:
          type: list
          description: Forward reads FASTQ file
      - output/*_R2.fastp_split.fastq.gz:
          type: list
          description: Reverse reads FASTQ file
  command_files:
    - - meta:
          type: map
          description: |-
            Groovy Map containing sample information
            e.g. [id: 'sample_id']
      - identifier:
          type: string
          description: Identifier for command files
      - command_files:
          type: list
          description: List of command files
  versions:
    - - versions.yml:
          type: file
          description: File containing software versions
          pattern: versions.yml
authors:
  - '@scwatts'
  - '@mkcmkc'
