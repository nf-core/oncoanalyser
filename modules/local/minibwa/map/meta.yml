name: minibwa_map
description: Align DNA reads to a reference genome with minibwa map
keywords:
  - map
  - read alignment
  - minibwa
tools:
  - minibwa:
      description: Minibwa is a software package for mapping DNA sequences against a large reference genome, the successor of bwa-mem
      homepage: https://github.com/lh3/minibwa
      documentation: https://github.com/lh3/minibwa
      licence: ["MIT"]
input:
  - meta:
      type: map
      description: |
        Groovy Map containing sample information
        e.g. [id: 'sample_id']
  - reads_fwd:
      type: file
      description: Forward reads FASTQ file
      pattern: "*.{fastq.gz}"
  - reads_rev:
      type: file
      description: Reverse reads FASTQ file
      pattern: "*.{fastq.gz}"
  - genome_fasta:
      type: file
      description: Reference genome assembly FASTA file
      pattern: "*.{fa,fasta}"
  - genome_minibwa_index:
      type: directory
      description: minibwa index directory
output:
  - meta:
      type: map
      description: |
        Groovy Map containing sample information
        e.g. [id: 'sample_id']
  - minibwa_align_bam:
      type: list
      description: BAM and BAI file
      pattern: "*.{bam,bam.bai}"
  - command_files:
      type: list
      description: List of command files
  - versions:
      type: file
      description: File containing software versions
      pattern: "versions.yml"
authors:
  - "@scwatts"
