name: linx_visualiser
description: Visualise LINX somatic annotations
keywords:
  - somatic
  - sv
  - annotation
  - visualisation
tools:
  - linx:
      description: An annotation, interpretation and visualisation tool for structural variants.
      homepage: https://github.com/hartwigmedical/hmftools/tree/master/linx
      documentation: https://github.com/hartwigmedical/hmftools/tree/master/linx
      licence:
        - GPL v3
input:
  - - meta:
        type: map
        description: |-
          Groovy Map containing sample information
          e.g. [id: 'sample_id']
    - linx_annotation_dir:
        type: directory
        description: LINX somatic annotation output directory
    - amber_dir:
        type: directory
        description: AMBER output directory (optional)
    - cobalt_dir:
        type: directory
        description: COBALT output directory (optional)
    - purple_dir:
        type: directory
        description: PURPLE output directory (optional)
  - - genome_ver:
        type: string
        description: Reference genome version
  - - ensembl_data_resources:
        type: directory
        description: HMF ensembl data resources directory
output: {}
topics:
  linx_visualiser_plots:
    - - meta:
          type: map
          description: |-
            Groovy Map containing sample information
            e.g. [id: 'sample_id']
      - plots/:
          type: directory
          description: Directory containing output plots
  command_files:
    - - meta:
          type: map
          description: |-
            Groovy Map containing sample information
            e.g. [id: 'sample_id']
      - identifier:
          type: string
          description: Identifier for command files
      - command_files:
          type: list
          description: List of command files
  versions:
    - - versions.yml:
          type: file
          description: File containing software versions
          pattern: versions.yml
authors:
  - '@scwatts'
