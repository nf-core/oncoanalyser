name: linx_germline
description: Generate LINX germline annotation data
keywords:
  - germline
  - sv
  - annotation
tools:
  - linx:
      description: An annotation, interpretation and visualisation tool for structural variants.
      homepage: https://github.com/hartwigmedical/hmftools/tree/master/linx
      documentation: https://github.com/hartwigmedical/hmftools/tree/master/linx
      licence:
        - GPL v3
input:
  - - meta:
        type: map
        description: |-
          Groovy Map containing sample information
          e.g. [id: 'sample_id']
    - sv_vcf:
        type: file
        description: PURPLE germline SV VCF file
        pattern: '*.{vcf.gz}'
  - - genome_ver:
        type: string
        description: Reference genome version
  - - ensembl_data_resources:
        type: directory
        description: HMF ensembl data resources directory
  - - driver_gene_panel:
        type: file
        description: Driver gene panel file
        pattern: '*.{tsv}'
output: {}
topics:
  linx_germline_annotation_dir:
    - - meta:
          type: map
          description: |-
            Groovy Map containing sample information
            e.g. [id: 'sample_id']
      - linx_germline/:
          type: directory
          description: LINX annotation output directory
  command_files:
    - - meta:
          type: map
          description: |-
            Groovy Map containing sample information
            e.g. [id: 'sample_id']
      - identifier:
          type: string
          description: Identifier for command files
      - command_files:
          type: list
          description: List of command files
  versions:
    - - versions.yml:
          type: file
          description: File containing software versions
          pattern: versions.yml
authors:
  - '@scwatts'
