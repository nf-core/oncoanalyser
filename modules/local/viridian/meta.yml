name: viridian
description: Detects oncoviruses with Viridian
keywords:
  - viral
  - integration
  - calling
tools:
  - viridian:
      description: Detects oncoviruses and their host integration sites
      homepage: https://github.com/hartwigmedical/hmftools/tree/master/viridian
      documentation: https://github.com/hartwigmedical/hmftools/tree/master/viridian
      licence: ["GPL v3"]
input:
  - meta:
      type: map
      description: |
        Groovy Map containing sample information
        e.g. [id: 'sample_id']
  - tumor_aln:
      type: file
      description: Tumor alignment file
      pattern: "*.{bam,cram}"
  - tumor_idx:
      type: file
      description: Tumor index file
      pattern: "*.{bai,crai}"
  - esvee_dir:
      type: directory
      description: ESVEE output directory
  - bamtools_somatic_dir:
      type: directory
      description: BamTools somatic output directory
  - purple_dir:
      type: directory
      description: PURPLE output directory
  - genome_fasta:
      type: file
      description: Reference genome assembly FASTA file
      pattern: "*.{fa,fasta}"
  - genome_fai:
      type: file
      description: Reference genome assembly fai file
      pattern: "*.{fai}"
  - genome_dict:
      type: file
      description: Reference genome assembly dict file
      pattern: "*.{dict}"
  - viridian_resources:
      type: directory
      description: Viridian resource directory
output:
  - meta:
      type: map
      description: |
        Groovy Map containing sample information
        e.g. [id: 'sample_id']
  - viridian_dir:
      type: directory
      description: Viridian output directory
  - command_files:
      type: list
      description: List of command files
  - versions:
      type: file
      description: File containing software versions
      pattern: "versions.yml"
authors:
  - "@reecejones-hartwig"
