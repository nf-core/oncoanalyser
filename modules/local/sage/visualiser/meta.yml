name: sage_visualiser
description: Visualising variants called by SAGE
keywords:
  - visualiser
  - variant caller
  - snv
  - mnv
tools:
  - sage:
      description: A precise and highly sensitive somatic SNV, MNV and small INDEL caller.
      homepage: https://github.com/hartwigmedical/hmftools/tree/master/sage
      documentation: https://github.com/hartwigmedical/hmftools/tree/master/sage
      licence:
        - GPL v3
input:
  - - meta:
        type: map
        description: |-
          Groovy Map containing sample information
          e.g. [id: 'sample_id']
    - tumor_aln:
        type: file
        description: Tumor BAM file
        pattern: '*.{bam}'
    - normal_aln:
        type: file
        description: Normal BAM file (optional)
        pattern: '*.{bam}'
    - donor_alns:
        type: list
        description: Donor alignment files
    - tumor_idx:
        type: file
        description: Tumor BAI file
        pattern: '*.{bai}'
    - normal_idx:
        type: file
        description: Normal BAI file (optional)
        pattern: '*.{bai}'
    - donor_idxs:
        type: list
        description: Donor index files
    - redux_tsvs:
        type: list
        description: REDUX MS files
    - purple_vcf:
        type: file
        description: Somatic VCF from PURPLE
        pattern: '*.{vcf.gz}'
    - purple_vcf_tbi:
        type: file
        description: Index for somatic VCF from PURPLE
        pattern: '*.{vcf.gz.tbi}'
  - - genome_fasta:
        type: file
        description: Reference genome assembly FASTA file
        pattern: '*.{fa,fasta}'
  - - genome_ver:
        type: string
        description: Reference genome version
  - - genome_fai:
        type: file
        description: Reference genome assembly fai file
        pattern: '*.{fai}'
  - - genome_dict:
        type: file
        description: Reference genome assembly dict file
        pattern: '*.{dict}'
  - - sage_pon:
        type: file
        description: SAGE PON file
        pattern: '*.{tsv.gz}'
  - - sage_known_hotspots_somatic:
        type: file
        description: SAGE somatic known hotspots file
        pattern: '*.{vcf.gz}'
  - - sage_highconf_regions:
        type: file
        description: SAGE high confidence regions file
        pattern: '*.{bed.gz}'
  - - ensembl_data_resources:
        type: directory
        description: HMF ensembl data resources directory
  - - targeted_mode:
        type: boolean
        description: Flag indicating whether targeted mode is set
output: {}
topics:
  sage_visualiser_dir:
    - - meta:
          type: map
          description: |-
            Groovy Map containing sample information
            e.g. [id: 'sample_id']
      - sage_vis/:
          type: directory
          description: SAGE visualiser output directory
  command_files:
    - - meta:
          type: map
          description: |-
            Groovy Map containing sample information
            e.g. [id: 'sample_id']
      - identifier:
          type: string
          description: Identifier for command files
      - command_files:
          type: list
          description: List of command files
  versions:
    - - versions.yml:
          type: file
          description: File containing software versions
          pattern: versions.yml
authors:
  - '@scwatts'
