name: virusbreakend
description: Detect viral integration from WGS data
keywords:
  - viral
  - integration
  - sv
tools:
  - virusbreakend:
      description: Performs detection of viral intergation from WGS data
      homepage: https://github.com/PapenfussLab/gridss/blob/master/VIRUSBreakend_Readme.md
      documentation: https://github.com/PapenfussLab/gridss/blob/master/VIRUSBreakend_Readme.md
      licence:
        - GPL v3
input:
  - - meta:
        type: map
        description: |-
          Groovy Map containing sample information
          e.g. [id: 'sample_id']
    - aln:
        type: file
        description: Alignment file
        pattern: '*.{bam,cram}'
  - - genome_fasta:
        type: file
        description: Reference genome assembly FASTA file
        pattern: '*.{fa,fasta}'
  - - genome_fai:
        type: file
        description: Reference genome assembly fai file
        pattern: '*.{fai}'
  - - genome_dict:
        type: file
        description: Reference genome assembly dict file
        pattern: '*.{dict}'
  - - genome_gridss_index:
        type: directory
        description: Reference genome assembly GRIDSS index file
  - - virusbreakenddb:
        type: directory
        description: VIRUSBreakend database directory
  - - gridss_config:
        type: file
        description: GRIDSS configuration file
output: {}
topics:
  virusbreakend_tsv:
    - - meta:
          type: map
          description: |-
            Groovy Map containing sample information
            e.g. [id: 'sample_id']
      - '*.summary.tsv':
          type: file
          description: VIRUSBreakned summary file
          pattern: '*.summary.tsv'
  virusbreakend_vcf:
    - - meta:
          type: map
          description: |-
            Groovy Map containing sample information
            e.g. [id: 'sample_id']
      - '*.virusbreakend.vcf':
          type: file
          description: VIRUSBreakend VCF file
          pattern: '*.virusbreakend.vcf'
  command_files:
    - - meta:
          type: map
          description: |-
            Groovy Map containing sample information
            e.g. [id: 'sample_id']
      - identifier:
          type: string
          description: Identifier for command files
      - command_files:
          type: list
          description: List of command files
  versions:
    - - versions.yml:
          type: file
          description: File containing software versions
          pattern: versions.yml
authors:
  - '@scwatts'
