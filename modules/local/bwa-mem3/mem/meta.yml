name: bwa-mem3_mem
description: The mem alignment algorithm of bwa-mem3
keywords:
  - bwa
  - mem
  - read alignment
  - bwa-mem3
tools:
  - bwa-mem3:
      description: Burrow-Wheeler Aligner for short-read alignment
      homepage: https://github.com/fg-labs/bwa-mem3
      documentation: https://bwa-mem3.readthedocs.io
      licence: ["MIT"]
input:
  - meta:
      type: map
      description: |
        Groovy Map containing sample information
        e.g. [id: 'sample_id']
  - reads_fwd:
      type: file
      description: Forward reads FASTQ file
      pattern: "*.{fastq.gz}"
  - reads_rev:
      type: file
      description: Reverse reads FASTQ file
      pattern: "*.{fastq.gz}"
  - genome_fasta:
      type: file
      description: Reference genome assembly FASTA file
      pattern: "*.{fa,fasta}"
  - genome_bwamem2_index:
      type: directory
      description: bwa-mem2 format index directory
output:
  - meta:
      type: map
      description: |
        Groovy Map containing sample information
        e.g. [id: 'sample_id']
  - bwamem3_align_bam:
      type: list
      description: BAM and BAI file
      pattern: "*.{bam,bam.bai}"
  - command_files:
      type: list
      description: List of command files
  - versions:
      type: file
      description: File containing software versions
      pattern: "versions.yml"
authors:
  - "@scwatts"
  - "@mkcmkc"
